version: "3.9"

services:
  dashboard:
    build: .
    container_name: smart-grid-dashboard
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - .:/app
      - ./data:/app/data
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    networks:
      - smart-grid-network
    depends_on:
      - api

  api:
    build: .
    container_name: smart-grid-api
    ports:
      - "8000:8000"
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
    volumes:
      - .:/app
      - ./data:/app/data
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - smart-grid-network

  tests:
    build: .
    container_name: smart-grid-tests
    volumes:
      - .:/app
      - ./data:/app/data
    command: pytest test_pipeline.py -v
    networks:
      - smart-grid-network
    profiles:
      - testing

networks:
  smart-grid-network:
    driver: bridge
